[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customrp-core"
dynamic = ["version"]
description = "Discord Rich Presence library implementing CustomRP's behaviour, for Linux, macOS and Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KeiraOMG0" }]
keywords = ["discord", "rich presence", "rpc", "customrp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/KeiraOMG0/customrp-core"
Documentation = "https://github.com/KeiraOMG0/customrp-core/tree/main/docs"
Issues = "https://github.com/KeiraOMG0/customrp-core/issues"

[tool.setuptools.dynamic]
version = { attr = "customrp_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a real Discord client running (see docs/development.md)"]
