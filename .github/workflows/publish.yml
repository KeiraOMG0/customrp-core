# Builds the package on every push, and publishes it to PyPI when a v* tag is pushed.
# Publishing uses PyPI's trusted publishing (no API token), and waits for approval in the
# "pypi" environment. See docs/development.md, "Releasing".

name: Publish to PyPI

on: push

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install build tools
        run: python3 -m pip install build twine --user
      - name: Build a wheel and a source tarball
        run: python3 -m build
      - name: Check the package metadata
        run: python3 -m twine check --strict dist/*
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! ls dist/*-"$version"-py3-none-any.whl >/dev/null 2>&1; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version:" dist/*.whl
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
