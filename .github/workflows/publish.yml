# CI for main, and automatic releases.
#
# On every push to main (and on pull requests), this runs the tests and builds the package. On main,
# if the version in __init__.py isn't on PyPI yet, it then publishes it to PyPI, tags the commit
# vX.Y.Z and creates a GitHub release. So releasing is: bump __version__, update CHANGELOG.md, push.
#
# Publishing uses PyPI's trusted publishing (no API token), through the "pypi" environment.
# PyPI trusts this file by name: renaming it breaks publishing. See docs/development.md, "Releasing".

name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install build tools
        run: python3 -m pip install build twine --user
      - name: Build a wheel and a source tarball
        run: python3 -m build
      - name: Check the package metadata
        run: python3 -m twine check --strict dist/*
      - name: Is this version on PyPI yet?
        id: version
        env:
          PROJECT: ${{ github.event.repository.name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PROJECT/$version/json")
          if [ "$status" = 404 ]; then
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            echo "$PROJECT $version isn't on PyPI yet"
          else
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            echo "$PROJECT $version is already on PyPI (HTTP $status); nothing to release"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.unreleased == 'true'
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Tag and create a GitHub release
    needs: [build, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PROJECT: ${{ github.event.repository.name }}
        run: |
          # This version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 == "## " v {f = 1; next} /^## /{f = 0} f' CHANGELOG.md > notes.md
          printf '\nhttps://pypi.org/project/%s/%s/\n' "$PROJECT" "$VERSION" >> notes.md
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$PROJECT $VERSION" --notes-file notes.md
